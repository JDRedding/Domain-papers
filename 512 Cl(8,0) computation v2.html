<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Clifford / Bott kernel</title>
</head>
<body>
<pre id="out"></pre>
<script>
"use strict";

const PRIME = 67108859; // 2^26 - 5

const col = (e) => Math.abs(e) - 1;
const sgn = (e) => (e < 0 ? -1 : 1);

/* ---------- signed permutations of R^n ---------- */
const SP = {
  id(n) {
    return Int32Array.from({ length: n }, (_, i) => i + 1);
  },
  mul(a, b) {
    return Int32Array.from(a, (e) => sgn(e) * b[col(e)]);
  },
  neg(a) {
    return Int32Array.from(a, (e) => -e);
  },
  eq(a, b) {
    return a.length === b.length && a.every((x, i) => x === b[i]);
  },
  pair(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) {
      if (a[i] === b[i]) s++;
      else if (a[i] === -b[i]) s--;
    }
    return s;
  },
  isScalar(a, s) {
    return a.every((e, i) => e === s * (i + 1));
  },
  kron(a, b) {
    const m = b.length;
    const out = new Int32Array(a.length * m);
    for (let i = 0; i < a.length; i++) {
      for (let k = 0; k < m; k++) {
        out[i * m + k] =
          sgn(a[i]) * sgn(b[k]) * (col(a[i]) * m + col(b[k]) + 1);
      }
    }
    return out;
  },
  dense(a) {
    return Array.from(a, (e) => {
      const r = new Array(a.length).fill(0);
      r[col(e)] = sgn(e);
      return r;
    });
  },
};

/* I, X, Z, J = XZ on one qubit; 4-fold strings -> 16 x 16 */
const NAME = ["I", "X", "Z", "J"];
const QPERM = [[0, 1], [1, 0], [0, 1], [1, 0]];
const QSIGN = [[1, 1], [1, 1], [1, -1], [-1, 1]];

function spFromQubits(s) {
  const out = new Int32Array(16);
  for (let r = 0; r < 16; r++) {
    let c = 0;
    let sign = 1;
    for (let k = 0; k < 4; k++) {
      const b = (r >> (3 - k)) & 1;
      c = 2 * c + QPERM[s[k]][b];
      sign *= QSIGN[s[k]][b];
    }
    out[r] = sign * (c + 1);
  }
  return out;
}

/* Cl(8,0) generators as in Pauli.lean */
const STR8 = [
  [0, 0, 0, 1],
  [0, 0, 0, 2],
  [0, 0, 3, 3],
  [0, 3, 1, 3],
  [1, 3, 2, 3],
  [2, 3, 2, 3],
  [3, 0, 2, 3],
  [3, 1, 1, 3],
];
const F8 = STR8.map(spFromQubits);
const strName = (s) => s.map((k) => NAME[k]).join("");

function monomial(idx, gens) {
  return idx.reduce((acc, i) => SP.mul(acc, gens[i]), SP.id(gens[0].length));
}
const OMEGA = monomial([0, 1, 2, 3, 4, 5, 6, 7], F8);

/* ---------- dense integer matrices ---------- */
const Mat = {
  zeros(n) {
    return { n, a: new Float64Array(n * n) };
  },
  eye(n) {
    const m = Mat.zeros(n);
    for (let i = 0; i < n; i++) m.a[i * n + i] = 1;
    return m;
  },
  fromRows(rows) {
    const n = rows.length;
    const m = Mat.zeros(n);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) m.a[i * n + j] = rows[i][j];
    }
    return m;
  },
  fromSP(sp) {
    const n = sp.length;
    const m = Mat.zeros(n);
    for (let r = 0; r < n; r++) m.a[r * n + col(sp[r])] = sgn(sp[r]);
    return m;
  },
  copy(m) {
    return { n: m.n, a: Float64Array.from(m.a) };
  },
  mul(x, y) {
    const n = x.n;
    const out = Mat.zeros(n);
    const A = x.a, B = y.a, C = out.a;
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < n; k++) {
        const v = A[i * n + k];
        if (!v) continue;
        for (let j = 0; j < n; j++) C[i * n + j] += v * B[k * n + j];
      }
    }
    return out;
  },
  add(x, y, s = 1) {
    const out = Mat.copy(x);
    for (let i = 0; i < out.a.length; i++) out.a[i] += s * y.a[i];
    return out;
  },
  scale(x, s) {
    const out = Mat.copy(x);
    for (let i = 0; i < out.a.length; i++) out.a[i] *= s;
    return out;
  },
  eq(x, y) {
    if (x.n !== y.n) return false;
    for (let i = 0; i < x.a.length; i++) if (x.a[i] !== y.a[i]) return false;
    return true;
  },
  kron(x, y) {
    const n = x.n, m = y.n;
    const out = Mat.zeros(n * m);
    const N = n * m;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const v = x.a[i * n + j];
        if (!v) continue;
        for (let k = 0; k < m; k++) {
          for (let l = 0; l < m; l++) {
            out.a[(i * m + k) * N + j * m + l] = v * y.a[k * m + l];
          }
        }
      }
    }
    return out;
  },
  trace(x) {
    let s = 0;
    for (let i = 0; i < x.n; i++) s += x.a[i * x.n + i];
    return s;
  },
  rows(x) {
    const r = [];
    for (let i = 0; i < x.n; i++) {
      r.push(Array.from(x.a.subarray(i * x.n, (i + 1) * x.n)));
    }
    return r;
  },
};

const LETTER = {
  I: [[1, 0], [0, 1]],
  X: [[0, 1], [1, 0]],
  Z: [[1, 0], [0, -1]],
  J: [[0, -1], [1, 0]],
};

function denseOfString(str) {
  return str.split("").reduce(
    (acc, L) => Mat.kron(acc, Mat.fromRows(LETTER[L])),
    Mat.eye(1)
  );
}

/* rank over F_p; lower bound for rank_Q */
function rankModP(rows, ncols) {
  const p = PRIME;
  const M = rows.map((r) => r.map((v) => ((v % p) + p) % p));
  const mulmod = (a, b) => Number((BigInt(a) * BigInt(b)) % BigInt(p));
  const modpow = (b, e) => {
    let r = 1;
    b %= p;
    while (e > 0) {
      if (e & 1) r = mulmod(r, b);
      b = mulmod(b, b);
      e >>= 1;
    }
    return r;
  };
  const mm = (a, b) => (a * b) % p;
  let rank = 0;
  for (let c = 0; c < ncols && rank < M.length; c++) {
    let piv = -1;
    for (let r = rank; r < M.length; r++) {
      if (M[r][c] !== 0) { piv = r; break; }
    }
    if (piv < 0) continue;
    [M[rank], M[piv]] = [M[piv], M[rank]];
    const inv = modpow(M[rank][c], p - 2);
    for (let j = c; j < ncols; j++) M[rank][j] = mm(M[rank][j], inv);
    for (let r = 0; r < M.length; r++) {
      if (r !== rank && M[r][c] !== 0) {
        const f = M[r][c];
        for (let j = c; j < ncols; j++) {
          M[r][j] = (M[r][j] - mm(f, M[rank][j]) + p) % p;
        }
      }
    }
    rank++;
  }
  return rank;
}

/* ---------- Pauli-string algebra on (C^2)^{\otimes k} ---------- */
const LMUL = {
  II: [1, "I"], IX: [1, "X"], IZ: [1, "Z"], IJ: [1, "J"],
  XI: [1, "X"], XX: [1, "I"], XZ: [1, "J"], XJ: [1, "Z"],
  ZI: [1, "Z"], ZX: [-1, "J"], ZZ: [1, "I"], ZJ: [-1, "X"],
  JI: [1, "J"], JX: [-1, "Z"], JZ: [1, "X"], JJ: [-1, "I"],
};

function strMul(a, b) {
  let s = 1;
  let out = "";
  for (let i = 0; i < a.length; i++) {
    const r = LMUL[a[i] + b[i]];
    s *= r[0];
    out += r[1];
  }
  return [s, out];
}

const PP = {
  of(str, c = 1) {
    return { t: "pp", k: str.length, m: new Map([[str, c]]) };
  },
  id(k) {
    return PP.of("I".repeat(k));
  },
  add(x, y, s = 1) {
    const m = new Map(x.m);
    for (const [k, v] of y.m) {
      const r = (m.get(k) || 0) + s * v;
      if (r === 0) m.delete(k);
      else m.set(k, r);
    }
    return { t: "pp", k: x.k, m };
  },
  mul(x, y) {
    const m = new Map();
    for (const [a, u] of x.m) {
      for (const [b, v] of y.m) {
        const [s, c] = strMul(a, b);
        const r = (m.get(c) || 0) + s * u * v;
        if (r === 0) m.delete(c);
        else m.set(c, r);
      }
    }
    return { t: "pp", k: x.k, m };
  },
  kron(x, y) {
    const m = new Map();
    for (const [a, u] of x.m) {
      for (const [b, v] of y.m) m.set(a + b, u * v);
    }
    return { t: "pp", k: x.k + y.k, m };
  },
  isZero(x) {
    return x.m.size === 0;
  },
  eq(x, y) {
    return PP.isZero(PP.add(x, y, -1));
  },
  show(x) {
    if (x.m.size === 0) return "0";
    return [...x.m.entries()]
      .sort((a, b) => (a[0] < b[0] ? -1 : 1))
      .map(([s, c]) =>
        (c < 0 ? "- " : "+ ") + (Math.abs(c) === 1 ? "" : Math.abs(c) + " ") + s
      )
      .join(" ")
      .replace(/^\+ /, "");
  },
};

/* ---------- sparse rows (any n, not only 2^k) ---------- */
const SR = {
  fromMat(M) {
    const rows = [];
    for (let i = 0; i < M.n; i++) {
      const r = new Map();
      for (let j = 0; j < M.n; j++) {
        if (M.a[i * M.n + j]) r.set(j, M.a[i * M.n + j]);
      }
      rows.push(r);
    }
    return { t: "sr", n: M.n, rows };
  },
  id(n) {
    return {
      t: "sr",
      n,
      rows: Array.from({ length: n }, (_, i) => new Map([[i, 1]])),
    };
  },
  add(x, y, s = 1) {
    return {
      t: "sr",
      n: x.n,
      rows: x.rows.map((r, i) => {
        const o = new Map(r);
        for (const [j, v] of y.rows[i]) {
          const w = (o.get(j) || 0) + s * v;
          if (w === 0) o.delete(j);
          else o.set(j, w);
        }
        return o;
      }),
    };
  },
  mul(x, y) {
    return {
      t: "sr",
      n: x.n,
      rows: x.rows.map((r) => {
        const o = new Map();
        for (const [k, v] of r) {
          for (const [j, w] of y.rows[k]) {
            const z = (o.get(j) || 0) + v * w;
            if (z === 0) o.delete(j);
            else o.set(j, z);
          }
        }
        return o;
      }),
    };
  },
  kron(x, y) {
    const n = x.n, m = y.n;
    const rows = [];
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < m; k++) {
        const o = new Map();
        for (const [j, v] of x.rows[i]) {
          for (const [l, w] of y.rows[k]) o.set(j * m + l, v * w);
        }
        rows.push(o);
      }
    }
    return { t: "sr", n: n * m, rows };
  },
  isZero(x) {
    return x.rows.every((r) => r.size === 0);
  },
  trace(x) {
    let s = 0;
    x.rows.forEach((r, i) => { s += r.get(i) || 0; });
    return s;
  },
};

/* ---------- sparse polynomials, reduce on S: sum_{i in S} x_i^2 = 1 ---------- */
const Poly = {
  key(e) {
    return e.join(",");
  },
  unkey(k) {
    return k === "" ? [] : k.split(",").map(Number);
  },
  const(c, nv) {
    const m = new Map();
    if (c) m.set(new Array(nv).fill(0).join(","), c);
    return m;
  },
  var(i, c, nv) {
    const e = new Array(nv).fill(0);
    e[i] = 1;
    return new Map([[e.join(","), c]]);
  },
  add(a, b, s = 1) {
    const m = new Map(a);
    for (const [k, v] of b) {
      const r = (m.get(k) || 0) + s * v;
      if (r === 0) m.delete(k);
      else m.set(k, r);
    }
    return m;
  },
  mul(a, b) {
    const m = new Map();
    for (const [ka, va] of a) {
      const ea = Poly.unkey(ka);
      for (const [kb, vb] of b) {
        const eb = Poly.unkey(kb);
        const k = ea.map((x, i) => x + eb[i]).join(",");
        const r = (m.get(k) || 0) + va * vb;
        if (r === 0) m.delete(k);
        else m.set(k, r);
      }
    }
    return m;
  },
  reduceSphere(p, S) {
    if (!S.length) return p;
    const top = Math.max(...S);
    const others = S.filter((i) => i !== top);
    let cur = new Map(p);
    let changed = true;
    while (changed) {
      changed = false;
      const next = new Map();
      const put = (k, v) => {
        const r = (next.get(k) || 0) + v;
        if (r === 0) next.delete(k);
        else next.set(k, r);
      };
      for (const [k, v] of cur) {
        const e = Poly.unkey(k);
        if (e[top] >= 2) {
          changed = true;
          const e0 = e.slice();
          e0[top] -= 2;
          put(e0.join(","), v);
          for (const i of others) {
            const ei = e0.slice();
            ei[i] += 2;
            put(ei.join(","), -v);
          }
        } else {
          put(k, v);
        }
      }
      cur = next;
    }
    return cur;
  },
  show(a, names) {
    if (a.size === 0) return "0";
    return [...a.entries()]
      .map(([k, v]) => {
        const e = Poly.unkey(k);
        const mono = e
          .map((x, i) => (x === 0 ? "" : names[i] + (x > 1 ? "^" + x : "")))
          .filter(Boolean)
          .join(" ");
        const c = Math.abs(v);
        return (v < 0 ? "- " : "+ ") + (mono ? (c === 1 ? "" : c + " ") + mono : String(c));
      })
      .join(" ")
      .replace(/^\+ /, "");
  },
};

function polyMatMul(A, B, N) {
  const C = new Array(N * N).fill(null);
  for (let i = 0; i < N; i++) {
    for (let k = 0; k < N; k++) {
      const a = A[i * N + k];
      if (!a) continue;
      for (let j = 0; j < N; j++) {
        const b = B[k * N + j];
        if (!b) continue;
        const pr = Poly.mul(a, b);
        C[i * N + j] = C[i * N + j] ? Poly.add(C[i * N + j], pr) : pr;
      }
    }
  }
  return C;
}

/* free Clifford word: sort + cancel with signature s_i = ±1 */
function normalWord(word, sig) {
  const w = word.slice();
  let s = 1;
  let changed = true;
  while (changed) {
    changed = false;
    for (let k = 0; k + 1 < w.length; k++) {
      if (w[k] === w[k + 1]) {
        s *= sig[w[k]];
        w.splice(k, 2);
        changed = true;
        break;
      }
      if (w[k] > w[k + 1]) {
        [w[k], w[k + 1]] = [w[k + 1], w[k]];
        s = -s;
        changed = true;
        break;
      }
    }
  }
  return { s, w };
}

const showWord = (s, w) =>
  (s < 0 ? "-" : "") + (w.length ? w.map((i) => "e" + i).join(" ") : "1");

/* Bott shift: (p,q,N,g) -> (p+8,q,16N, {g⊗ω} ∪ {I⊗f_j}) */
function shiftCode(code) {
  const idN = SP.id(code.N);
  const oldPos = code.gens.slice(0, code.p).map((g) => SP.kron(g, OMEGA));
  const oldNeg = code.gens.slice(code.p).map((g) => SP.kron(g, OMEGA));
  const fresh = F8.map((f) => SP.kron(idN, f));
  return {
    p: code.p + 8,
    q: code.q,
    N: code.N * 16,
    gens: oldPos.concat(fresh, oldNeg),
  };
}

const C0 = {
  p: 1,
  q: 1,
  N: 2,
  gens: [Int32Array.from([2, 1]), Int32Array.from([-2, 1])],
};

/* ---------- small self-check ---------- */
function selfCheck() {
  const lines = [];
  lines.push("Cl(8,0) generators on R^16");
  STR8.forEach((s, i) => lines.push("  e" + i + " = " + strName(s)));
  lines.push("");
  lines.push("e_i^2 = I (all i): " + F8.every((g) => SP.isScalar(SP.mul(g, g), 1)));

  let anti = true;
  let orth = true;
  for (let i = 0; i < 8; i++) {
    for (let j = i + 1; j < 8; j++) {
      if (!SP.eq(SP.mul(F8[i], F8[j]), SP.neg(SP.mul(F8[j], F8[i])))) anti = false;
      if (SP.pair(F8[i], F8[j]) !== 0) orth = false;
    }
  }
  lines.push("e_i e_j = -e_j e_i (i≠j): " + anti);
  lines.push("<e_i,e_j> = 16 δ_ij: " + orth);

  const word = normalWord([1, 0, 1, 0], Array(8).fill(1));
  lines.push("normal form of e1 e0 e1 e0 = " + showWord(word.s, word.w));

  const flat = F8.map((g) => Array.from(Mat.fromSP(g).a));
  lines.push("rank_p of the 8 generators in M_16: " + rankModP(flat, 256));

  const x2 = Poly.mul(Poly.var(0, 1, 3), Poly.var(0, 1, 3));
  const y2 = Poly.mul(Poly.var(1, 1, 3), Poly.var(1, 1, 3));
  const z2 = Poly.mul(Poly.var(2, 1, 3), Poly.var(2, 1, 3));
  let sph = Poly.add(Poly.add(x2, y2), z2);
  sph = Poly.add(sph, Poly.const(-1, 3));
  const red = Poly.reduceSphere(sph, [0, 1, 2]);
  lines.push("x^2+y^2+z^2-1 reduced on S^2 = " + Poly.show(red, ["x", "y", "z"]));

  const C1 = shiftCode(C0);
  lines.push(
    "Bott shift Cl(1,1) on Z^2 -> Cl(" +
      C1.p + "," + C1.q + ") on Z^" + C1.N +
      ", " + C1.gens.length + " gens"
  );
  return lines.join("\n");
}

document.getElementById("out").textContent = selfCheck();

window.BN = {
  SP, Mat, PP, SR, Poly,
  F8, STR8, OMEGA, C0,
  rankModP, normalWord, shiftCode, denseOfString,
};
</script>
</body>
</html>
